<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>forev.ext — Key Admin</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#0b1220; color:#e8eefc; margin:0; padding:24px; }
    .card { max-width: 900px; margin: 0 auto; background:#111a2e; border:1px solid #22314f; border-radius:14px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    h1 { margin:0 0 8px; font-size:22px; }
    .muted { color:#9fb0d0; font-size:13px; margin-bottom:18px; }
    label { display:block; margin:10px 0 6px; color:#b9c7e6; font-size:13px; }
    input, button { padding:10px 12px; border-radius:10px; border:1px solid #2a3b60; background:#0e1628; color:#e8eefc; }
    input { width:100%; box-sizing:border-box; }
    .row { display:grid; grid-template-columns: 1fr 140px 140px 140px; gap:10px; align-items:end; }
    button { cursor:pointer; background:#1c355f; border-color:#2d508f; font-weight:600; }
    button:hover { background:#234275; }
    table { width:100%; border-collapse:collapse; margin-top:18px; font-size:13px; }
    th, td { border-bottom:1px solid #22314f; padding:10px 8px; text-align:left; vertical-align:top; }
    th { color:#9fb0d0; font-weight:600; }
    code { background:#0b1324; padding:2px 6px; border-radius:6px; border:1px solid #22314f; }
    .ok { color:#5bd68d; } .bad { color:#ff7b7b; }
    pre { background:#0b1324; border:1px solid #22314f; border-radius:10px; padding:12px; overflow:auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1>forev.ext — Key Generator</h1>
    <div class="muted">Set server env <code>ADMIN_PASSWORD</code>. Use the same password here. Keys are bound to HWID on first successful validation.</div>

    <label>Admin password</label>
    <input id="pw" type="password" placeholder="ADMIN_PASSWORD" />

    <div class="row" style="margin-top:10px;">
      <div>
        <label>Note (optional)</label>
        <input id="note" placeholder="customer / reason" />
      </div>
      <div>
        <label>Days (0 = lifetime)</label>
        <input id="days" type="number" value="30" min="0" />
      </div>
      <div>
        <label>Count</label>
        <input id="count" type="number" value="1" min="1" max="100" />
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="gen">Generate</button>
      </div>
    </div>

    <div style="margin-top:12px; display:flex; gap:10px;">
      <button id="refresh" type="button">Refresh list</button>
      <button id="revoke" type="button">Revoke key</button>
      <input id="revokeKey" placeholder="KEY TO REVOKE" style="max-width:320px;" />
    </div>

    <h3 style="margin-top:18px;">Generated (last action)</h3>
    <pre id="out">—</pre>

    <h3>All keys</h3>
    <div style="overflow:auto;">
      <table id="tbl"><thead><tr><th>Key</th><th>Status</th><th>HWID</th><th>Expires</th><th>Note</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
function fmt(ts){ if(!ts) return 'lifetime'; return new Date(ts).toLocaleString(); }
function show(obj){ $('out').textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2); }

async function api(path, body){
  const pw = $('pw').value;
  let r, text;
  try {
    r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': pw },
      body: JSON.stringify(body || {})
    });
    text = await r.text();
  } catch (e) {
    throw new Error('Network error: ' + e.message);
  }
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch (_) { data = { ok:false, error:'bad_response', status:r.status, raw:text }; }
  if (!r.ok && data && data.ok === undefined) data.ok = false;
  data._status = r.status;
  return data;
}

$('gen').onclick = async () => {
  show('Generating...');
  try {
    const res = await api('/api/admin/generate', { count: $('count').value, days: $('days').value, note: $('note').value });
    show(res);
    if (res.ok) await load();
  } catch (e) {
    show(String(e.message || e));
  }
};

$('refresh').onclick = () => load(true);

$('revoke').onclick = async () => {
  show('Revoking...');
  try {
    const res = await api('/api/admin/revoke', { key: $('revokeKey').value });
    show(res);
    if (res.ok) await load();
  } catch (e) {
    show(String(e.message || e));
  }
};

async function load(showStatus){
  const pw = $('pw').value;
  if (showStatus) show('Loading...');
  let r, text;
  try {
    r = await fetch('/api/admin/list', { headers: { 'x-admin-password': pw } });
    text = await r.text();
  } catch (e) {
    show('Network error: ' + e.message);
    return;
  }
  let res;
  try { res = text ? JSON.parse(text) : {}; } catch (_) { res = { ok:false, error:'bad_response', raw:text }; }
  if (!res.ok) { show(res); return; }
  const tb = $('tbl').querySelector('tbody'); tb.innerHTML = '';
  (res.keys || []).slice().reverse().forEach(k => {
    const tr = document.createElement('tr');
    const expired = k.expiresAt && Date.now() > k.expiresAt;
    const status = k.revoked ? '<span class="bad">revoked</span>' : expired ? '<span class="bad">expired</span>' : '<span class="ok">active</span>';
    tr.innerHTML = `<td><code>${k.key}</code></td><td>${status}</td><td>${k.hwid?('<code>'+k.hwid+'</code>'):'—'}</td><td>${fmt(k.expiresAt)}</td><td>${k.note||''}</td>`;
    tb.appendChild(tr);
  });
  if (showStatus) show({ ok:true, count: (res.keys||[]).length });
}
</script>
</body>
</html>
